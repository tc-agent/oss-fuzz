ServerName "Combined"
ServerType standalone
DefaultServer on
Port 21
Umask 022
SyslogFacility DAEMON
SyslogLevel info
DebugLevel 5
PidFile /var/run/proftpd.pid
ScoreboardFile /var/run/proftpd.scoreboard
TimeoutIdle 600
TimeoutLogin 120
TimeoutNoTransfer 900
TimeoutStalled 3600
TimeoutSession 0
MaxInstances 30
MaxClients 50

<Class trusted>
  From 192.168.0.0/16
  From .internal.example.com
  Satisfy any
</Class>

<Global>
  TransferLog /var/log/xferlog
  AllowForeignAddress on
  PassivePorts 49152 65534
  MasqueradeAddress 1.2.3.4
  AllowFilter "[A-Za-z0-9_.-]+"
</Global>

<Anonymous /var/ftp>
  User ftp
  Group ftp
  UserAlias anonymous ftp
  AnonRequirePassword off
  RequireValidShell off
  MaxClients 10 "Sorry, %m anonymous users connected"
  DisplayLogin welcome.msg
  DisplayChdir .message
  
  <Directory *>
    <Limit WRITE>
      DenyAll
    </Limit>
  </Directory>

  <Directory incoming>
    Umask 022
    HiddenStores on
    <Limit READ>
      DenyAll
    </Limit>
    <Limit STOR>
      AllowAll
    </Limit>
  </Directory>
</Anonymous>

<Directory /home/*>
  AllowOverwrite on
  HideNoAccess on
  HideUser root
  HideGroup wheel
  AllowFilter "[A-Za-z0-9_.-]+"
  DenyFilter "\\.\\."
</Directory>

<VirtualHost ftp.example.com>
  ServerName "Vhost1"
  Port 2121
  AuthOrder mod_auth_file.c
  AuthUserFile /etc/vhost1.passwd
  <Limit LOGIN>
    AllowClass trusted
    DenyAll
  </Limit>
</VirtualHost>

<IfDefine SECURE>
  Port 22
</IfDefine>
