LogFormat default "%h %l %u %t \"%r\" %s %b"
LogFormat access "%t %v %a %u %m %f %s %b %T"
LogFormat json "{\"user\":\"%u\",\"file\":\"%f\",\"size\":%b}"
LogFormat detailed "%h %l %u %{epoch} %{remote_ip} %{response_code}"
ExtendedLog /var/log/proftpd/access.log ALL default
ExtendedLog /var/log/proftpd/auth.log AUTH access
ExtendedLog /var/log/proftpd/transfer.log RETR,STOR detailed
